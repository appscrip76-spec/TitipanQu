<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - TitipanQ</title>
    
    <!-- Favicon & Meta -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">

    <!-- Fonts & CSS Frameworks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #f1f5f9; 
            font-family: 'Inter', sans-serif; 
            color: #334155; 
        }
        .login-card {
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .brand-icon {
            font-size: 3.5rem;
            color: #10b981;
            filter: drop-shadow(0 4px 6px rgba(16, 185, 129, 0.2));
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            box-shadow: none !important;
        }
        .form-control:focus {
            border-color: #10b981;
        }
        .input-group:focus-within .input-group-text, 
        .input-group:focus-within .form-control {
            border-color: #10b981;
        }
        .btn-login {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background-color: #10b981;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
        }
        .input-group-text {
            border-radius: 10px;
            background-color: #f8fafc;
            border: 1px solid #dee2e6;
            color: #64748b;
        }
        .password-toggle {
            cursor: pointer;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
            <!-- Area Card Login -->
            <div class="card login-card border-0 bg-white p-4 p-md-5">
                <div class="text-center mb-4">
                    <img src="logo.png" alt="Logo" class="mb-3" style="width: 80px; height: 80px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(16, 185, 129, 0.2));">
                    <h4 class="fw-bold text-slate-800 mb-1" id="authTitle">Masuk ke TitipanQ</h4>
                    <p class="text-muted small" id="authSubtitle">Kelola warung pintar Anda dengan mudah</p>
                </div>

                <form id="formLogin" onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Email / Username</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 bg-transparent"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" placeholder="Ketik username Anda" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-muted d-flex justify-content-between w-100">
                            <span>Password</span>
                            <a href="#" class="text-success text-decoration-none">Lupa Password?</a>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 bg-transparent"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" placeholder="Ketik password Anda" required>
                            <span class="input-group-text bg-transparent password-toggle border-start-0" onclick="togglePassword()" title="Tampilkan Password">
                                <i class="fas fa-eye text-muted" id="toggleIcon"></i>
                            </span>
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input border-secondary cursor-pointer" id="rememberMe">
                        <label class="form-check-label small text-muted cursor-pointer" for="rememberMe">Ingat sesi saya</label>
                    </div>

                    <button type="submit" class="btn btn-login w-100 text-white shadow-sm mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i> Masuk Sekarang
                    </button>
                </form>
                
                <!-- Form Register (Disembunyikan default) -->
                <form id="formRegister" onsubmit="handleRegisterSubmit(event)" class="d-none">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Buat Username Baru</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 bg-transparent"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="regUsername" placeholder="Ketik username baru" required minlength="4">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-muted">Buat Password</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 bg-transparent"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="regPassword" placeholder="Ketik password Anda" required minlength="4">
                            <span class="input-group-text bg-transparent password-toggle border-start-0" onclick="togglePassword('regPassword', 'regToggleIcon')" title="Tampilkan Password">
                                <i class="fas fa-eye text-muted" id="regToggleIcon"></i>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-login w-100 text-white shadow-sm mb-3">
                        <i class="fas fa-user-plus me-2"></i> Daftar Akun
                    </button>
                </form>

                <div class="text-center mt-2">
                    <p class="small text-muted mb-0" id="authSwitchText">Belum punya akun? <a href="#" class="text-success fw-bold text-decoration-none" onclick="switchAuthMode(event, 'register')">Daftar Gratis</a></p>
                </div>
            </div>
            <!-- Footer -->
            <div class="text-center mt-4">
                <small class="text-muted"><i>Copyright 2026 @bysho.in</i></small>
            </div>
        </div>
    </div>
</div>

<!-- Script untuk Interaksi Form -->
<script>
    function togglePassword(inputId = 'password', iconId = 'toggleIcon') {
        const passwordInput = document.getElementById(inputId);
        const toggleIcon = document.getElementById(iconId);
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
        }
    }

    function switchAuthMode(event, mode) {
        event.preventDefault();
        if(mode === 'register') {
            document.getElementById('formLogin').classList.add('d-none');
            document.getElementById('formRegister').classList.remove('d-none');
            document.getElementById('authTitle').innerText = 'Daftar Akun Baru';
            document.getElementById('authSubtitle').innerText = 'Buat akun Anda secara gratis di perangkat ini';
            document.getElementById('authSwitchText').innerHTML = 'Sudah punya akun? <a href="#" class="text-success fw-bold text-decoration-none" onclick="switchAuthMode(event, \'login\')">Masuk di sini</a>';
        } else {
            document.getElementById('formRegister').classList.add('d-none');
            document.getElementById('formLogin').classList.remove('d-none');
            document.getElementById('authTitle').innerText = 'Masuk ke TitipanQ';
            document.getElementById('authSubtitle').innerText = 'Kelola warung pintar Anda dengan mudah';
            document.getElementById('authSwitchText').innerHTML = 'Belum punya akun? <a href="#" class="text-success fw-bold text-decoration-none" onclick="switchAuthMode(event, \'register\')">Daftar Gratis</a>';
        }
    }

    function handleRegisterSubmit(event) {
        event.preventDefault();
        const user = document.getElementById('regUsername').value.trim();
        const pass = document.getElementById('regPassword').value;

        let users = JSON.parse(localStorage.getItem('titipanq_users') || '[]');
        if(users.find(u => u.username.toLowerCase() === user.toLowerCase())) {
            Swal.fire('Gagal', 'Username sudah terdaftar. Silakan gunakan yang lain.', 'error');
            return;
        }

        users.push({ username: user, password: pass });
        localStorage.setItem('titipanq_users', JSON.stringify(users));

        Swal.fire('Berhasil!', 'Akun Anda berhasil dibuat. Silakan login.', 'success').then(() => {
            switchAuthMode({preventDefault:()=>{}}, 'login');
            document.getElementById('username').value = user;
            document.getElementById('password').value = '';
        });
    }

    function handleLogin(event) {
        event.preventDefault();
        
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;

        let users = JSON.parse(localStorage.getItem('titipanq_users') || '[]');
        let validUser = users.find(u => u.username.toLowerCase() === user.toLowerCase() && u.password === pass);

        if (validUser) {
            const btn = document.querySelector('#formLogin .btn-login');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memproses...';
            btn.disabled = true;
            
            // Set sesi user yang login
            localStorage.setItem('titipanq_loggedInUser', validUser.username);

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        } else {
            Swal.fire('Gagal', 'Username atau Password salah! Silakan periksa kembali atau Daftar Gratis jika belum punya akun.', 'error');
        }
    }
</script>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
