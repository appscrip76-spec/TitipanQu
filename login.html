<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - TitipanQ</title>
    
    <!-- Favicon & Meta -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/512/shopping-basket.png">
    <meta name="theme-color" content="#10b981">

    <!-- Fonts & CSS Frameworks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #f1f5f9; 
            font-family: 'Inter', sans-serif; 
            color: #334155; 
        }
        .login-card {
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .brand-icon {
            font-size: 3.5rem;
            color: #10b981;
            filter: drop-shadow(0 4px 6px rgba(16, 185, 129, 0.2));
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            box-shadow: none !important;
        }
        .form-control:focus {
            border-color: #10b981;
        }
        .input-group:focus-within .input-group-text, 
        .input-group:focus-within .form-control {
            border-color: #10b981;
        }
        .btn-login {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background-color: #10b981;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
        }
        .input-group-text {
            border-radius: 10px;
            background-color: #f8fafc;
            border: 1px solid #dee2e6;
            color: #64748b;
        }
        .password-toggle {
            cursor: pointer;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
            <!-- Area Card Login -->
            <div class="card login-card border-0 bg-white p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="fas fa-shopping-basket brand-icon mb-3"></i>
                    <h4 class="fw-bold text-slate-800 mb-1">Masuk ke TitipanQ</h4>
                    <p class="text-muted small">Kelola warung pintar Anda dengan mudah</p>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Email / Username</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 bg-transparent"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" placeholder="Ketik username Anda" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-muted d-flex justify-content-between w-100">
                            <span>Password</span>
                            <a href="#" class="text-success text-decoration-none">Lupa Password?</a>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 bg-transparent"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" placeholder="Ketik password Anda" required>
                            <span class="input-group-text bg-transparent password-toggle border-start-0" onclick="togglePassword()" title="Tampilkan Password">
                                <i class="fas fa-eye text-muted" id="toggleIcon"></i>
                            </span>
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input border-secondary cursor-pointer" id="rememberMe">
                        <label class="form-check-label small text-muted cursor-pointer" for="rememberMe">Ingat sesi saya</label>
                    </div>

                    <button type="submit" class="btn btn-login w-100 text-white shadow-sm mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i> Masuk Sekarang
                    </button>
                </form>
                
                <div class="text-center mt-2">
                    <p class="small text-muted mb-0">Belum punya akun? <a href="#" class="text-success fw-bold text-decoration-none" onclick="handleRegister(event)">Daftar Gratis</a></p>
                </div>
            </div>
            <!-- Footer -->
            <div class="text-center mt-4">
                <small class="text-muted"><i>Copyright 2026 @bysho.in</i></small>
            </div>
        </div>
    </div>
</div>

<!-- Script untuk Interaksi Form -->
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
        }
    }

    function handleRegister(event) {
        event.preventDefault();
        Swal.fire('Informasi', 'Sistem ini masih berjalan secara lokal (Local Storage). Anda tidak perlu mendaftar. Silakan isi Username & Password secara bebas lalu klik "Masuk Sekarang" untuk masuk ke Dashboard!', 'info');
    }

    function handleLogin(event) {
        event.preventDefault();
        
        const btn = document.querySelector('.btn-login');
        const originalText = btn.innerHTML;
        
        // Efek loading saat ditekan
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memproses...';
        btn.disabled = true;
        
        // Simulasi autentikasi (redirect otomatis ke index.html)
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1200);
    }
</script>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
